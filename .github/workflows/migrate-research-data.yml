name: Migrate TLP Research Data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Research Data source
        uses: actions/checkout@v4
        with:
          repository: formarketon-lang/TLP-Research-Data
          ref: main
          path: research-source
          fetch-depth: 1

      - name: Prepare destination folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-data

      - name: Copy all research data
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='SHA256SUMS' \
            research-source/ research-data/

          echo "Research data copy completed."

      - name: Compare source and destination SHA256
        shell: bash
        run: |
          set -euo pipefail

          (
            cd research-source
            find . -type f \
              ! -path './.git/*' \
              ! -name 'SHA256SUMS' \
              -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > /tmp/source.sha256

          (
            cd research-data
            find . -type f \
              ! -name 'SHA256SUMS' \
              -print0 |
              sort -z |
              xargs -0 sha256sum
          ) > /tmp/destination.sha256

          diff -u /tmp/source.sha256 /tmp/destination.sha256

          echo "SOURCE VS DESTINATION: PASS"

      - name: Create and verify SHA256 manifest
        shell: bash
        run: |
          set -euo pipefail

          cp /tmp/source.sha256 research-data/SHA256SUMS

          cd research-data
          sha256sum -c SHA256SUMS

          echo "SHA256 VERIFICATION: PASS"
          echo "Total migrated files:"
          wc -l < SHA256SUMS

      - name: Commit migrated research data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add research-data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m \
              "migration: complete TLP research data transfer with SHA256 verification"
            git push
          fi

      - name: Migration summary
        shell: bash
        run: |
          echo "TLP RESEARCH DATA MIGRATION: PASS"
          echo "Source: formarketon-lang/TLP-Research-Data"
          echo "Destination: glad4u7-crypto/Pro123"
          echo "SHA256 comparison and verification completed."
