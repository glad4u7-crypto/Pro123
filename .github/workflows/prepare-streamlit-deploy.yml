name: Prepare Streamlit Deployment

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r source-import/requirements.txt

      - name: Compile source
        run: python -m compileall -q source-import

      - name: Run complete tests
        working-directory: source-import
        run: python -m pytest -q

      - name: Prepare Streamlit configuration
        run: |
          mkdir -p .streamlit
          cp source-import/config.toml .streamlit/config.toml

          test -f source-import/app.py
          test -f source-import/requirements.txt
          test -f .streamlit/config.toml

          echo "Deployment files verified"

      - name: Commit deployment configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .streamlit/config.toml

          git commit -m \
            "deploy: prepare Streamlit configuration" \
            || echo "No configuration changes"

          git push
          
