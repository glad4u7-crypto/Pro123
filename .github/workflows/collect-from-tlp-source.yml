
name: Collect TLP Source Files

on:
  workflow_dispatch:
    inputs:
      source_paths:
        description: "One path per line"
        required: true
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect folders
        env:
          SOURCE_PATHS: ${{ inputs.source_paths }}
        run: |
          set -euo pipefail

          git clone --depth 1 --filter=blob:none \
            --no-checkout \
            https://github.com/formarketon-lang/123.git \
            source_repo

          declare -A SEEN=()

          while IFS= read -r SOURCE_PATH || [ -n "$SOURCE_PATH" ]; do
            SOURCE_PATH="${SOURCE_PATH%$'\r'}"
            [ -z "$SOURCE_PATH" ] && continue

            case "$SOURCE_PATH" in
              tests|scripts|docs|reports) ;;
              *)
                echo "Skipping unsupported input: $SOURCE_PATH"
                continue
                ;;
            esac

            if [[ -n "${SEEN[$SOURCE_PATH]+x}" ]]; then
              echo "Skipping duplicate: $SOURCE_PATH"
              continue
            fi
            SEEN[$SOURCE_PATH]=1

            git -C source_repo checkout origin/HEAD -- "$SOURCE_PATH"

            test -e "source_repo/$SOURCE_PATH"

            cp -a "source_repo/$SOURCE_PATH" source-import/

          done <<< "$SOURCE_PATHS"

      - name: Commit collected folders
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add source-import/

          if ! git diff --cached --quiet; then
            git commit -m "chore: collect remaining TLP folders"
            git push
          else
            echo "No new changes"
          fi
