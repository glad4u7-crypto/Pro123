
name: Collect TLP Source Files

on:
  workflow_dispatch:
    inputs:
      source_paths:
        description: "One source path per line"
        required: true
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working repository
        uses: actions/checkout@v4

      - name: Collect requested source paths
        env:
          SOURCE_PATHS: ${{ inputs.source_paths }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --filter=blob:none \
            --no-checkout \
            https://github.com/formarketon-lang/123.git \
            source_repo

          while IFS= read -r SOURCE_PATH; do
            [ -z "$SOURCE_PATH" ] && continue

            case "$SOURCE_PATH" in
              /*)
                echo "Absolute paths are not allowed"
                exit 1
                ;;
            esac

            case "/$SOURCE_PATH/" in
              *"/../"*)
                echo "Invalid path: $SOURCE_PATH"
                exit 1
                ;;
            esac

            echo "Collecting: $SOURCE_PATH"

            git -C source_repo checkout origin/HEAD -- "$SOURCE_PATH"

            if [ ! -e "source_repo/$SOURCE_PATH" ]; then
              echo "Path not found: $SOURCE_PATH"
              exit 1
            fi

            mkdir -p "source-import/$(dirname "$SOURCE_PATH")"

            cp -a "source_repo/$SOURCE_PATH" \
              "source-import/$SOURCE_PATH"

          done <<< "$SOURCE_PATHS"

      - name: Commit collected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add source-import/

          if ! git diff --cached --quiet; then
            git commit -m "chore: collect multiple TLP source folders"
            git push
          else
            echo "No new changes to commit"
          fi
