name: Collect TLP Source Files

on:
  workflow_dispatch:
    inputs:
      source_paths:
        description: "Comma-separated source paths"
        required: true
        type: string

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout working repository
        uses: actions/checkout@v4

      - name: Collect root files
        env:
          SOURCE_PATHS: ${{ inputs.source_paths }}
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/formarketon-lang/123.git \
            source_repo

          COUNT=0

          while IFS= read -r SOURCE_PATH; do
            SOURCE_PATH="$(echo "$SOURCE_PATH" | xargs)"
            [ -z "$SOURCE_PATH" ] && continue

            case "$SOURCE_PATH" in
              .gitignore|README.md|__init__.py|config.toml|requirements.txt|rs_engine.py|settings.py)
                ;;
              *)
                echo "Rejected path: $SOURCE_PATH"
                exit 1
                ;;
            esac

            if [ ! -f "source_repo/$SOURCE_PATH" ]; then
              echo "File not found: $SOURCE_PATH"
              exit 1
            fi

            mkdir -p "source-import"
            cp "source_repo/$SOURCE_PATH" \
              "source-import/$SOURCE_PATH"

            COUNT=$((COUNT + 1))
            echo "Collected: $SOURCE_PATH"

          done < <(printf '%s' "$SOURCE_PATHS" | tr ',' '\n')

          if [ "$COUNT" -eq 0 ]; then
            echo "No files selected"
            exit 1
          fi

      - name: Commit collected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add source-import/

          if ! git diff --cached --quiet; then
            git commit -m "chore: collect TLP root files"
            git push
          else
            echo "No changes to commit"
          fi